<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start</title>
<!--
  What a box opens when it has nothing else to open.

  Deliberately says nothing about Aviary, about boxes, or about the window it is
  sitting in. The first version of this page put the box's own name across it in
  large type and explained that it was a browser being mirrored in a dashboard --
  which is a page inside a window describing the application drawing the window,
  and reads exactly as strange as that sounds. The tile caption already says
  which bird this is; the page repeating it was the app talking to itself.

  So: somewhere to go, and nothing else. A start page is furniture.

  One file, no build, no assets, and no network -- it is opened over `file://` in
  an ordinary run and over local HTTP by the demo, and it has to look identical
  either way. The palette is `ui/theme.py`'s, by hand, because a browser page
  cannot import it. Sized for the viewport a box actually has, which is about
  960x513 CSS pixels: a 1440x900 DIP window is 1440x770 physical pixels of page,
  and this machine runs at 150%.
-->
<style>
  :root {
    --bg: #0f0f12;
    --field: #20202a;
    --edge: #2a2a33;
    --edge-bright: #3a3a46;
    --text: #eceef2;
    --muted: #8b8b98;
    --dim: #5a5a66;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sheet { width: 100%; max-width: 660px; padding: 0 32px; }

  h1 {
    margin: 0 0 22px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--dim);
  }

  .links {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  a {
    display: block;
    padding: 16px 18px;
    background: var(--field);
    border: 1px solid var(--edge);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 17px;
  }

  a:hover { background: #2a2a36; border-color: var(--edge-bright); }
  a span { display: block; color: var(--dim); font-size: 14px; margin-top: 4px; }
</style>
</head>
<body>

<div class="sheet">
  <h1>Start</h1>
  <div class="links">
    <a href="https://en.wikipedia.org">Wikipedia<span>en.wikipedia.org</span></a>
    <a href="https://news.ycombinator.com">Hacker News<span>news.ycombinator.com</span></a>
    <a href="https://docs.python.org/3/">Python docs<span>docs.python.org</span></a>
    <a href="https://developer.mozilla.org">MDN<span>developer.mozilla.org</span></a>
    <a href="https://arxiv.org">arXiv<span>arxiv.org</span></a>
    <a href="https://www.openstreetmap.org">OpenStreetMap<span>openstreetmap.org</span></a>
  </div>
</div>

</body>
</html>
